<div class="an-container login-wrapper">
  <div class="an-card login-card">
    <div class="login-header">
      <img src="assets/images/logo.png" alt="Anami Logo" class="login-logo" />
      <h1 class="an-title">Anami</h1>
      <p class="an-text-muted">Ingresa tus credenciales para acceder al dashboard</p>
    </div>

    @if (errorMessage()) {
      <div class="an-alert an-alert--error an-mb-4">
        <i class="ph ph-warning-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form class="login-form" (submit)="$event.preventDefault(); handleLogin()">
      <div class="an-field">
        <label for="email" class="an-label">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          class="an-field__input"
          placeholder="ejemplo@anami.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          required
        />
      </div>

      <div class="an-field">
        <label for="password" class="an-label">Contraseña</label>
        <input
          type="password"
          id="password"
          class="an-field__input"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          required
        />
      </div>

      <div class="login-actions an-mt-6">
        <button
          type="submit"
          class="an-button an-button--primary an-button--xl full-width"
          [disabled]="isLoading() || !email() || !password()"
        >
          @if (isLoading()) {
            <span class="an-spinner"></span>
            Verificando...
          } @else {
            Iniciar Sesión
          }
        </button>
      </div>
    </form>
  </div>
</div>
