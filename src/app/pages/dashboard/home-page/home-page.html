<header
  style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4.8rem"
>
  <div>
    <h2 class="an-text--display">Panel de Gestión</h2>
    <p style="color: #8c817c; font-size: 1.4rem">Bienvenida de nuevo, Anette.</p>
  </div>
  <button class="an-button">+ Nueva Cita</button>
</header>

<div class="an-grid">
  <div class="an-card">
    <span class="stat-label" style="font-size: 1.2rem; color: #8c817c">Ingresos del Mes</span>
    <span class="stat-value" style="font-size: 3.2rem; font-weight: 500; display: block"
      >$1.240.000</span
    >
    <span style="color: #2d9d78; font-size: 1.2rem; font-weight: 600">↑ 12% vs mes anterior</span>
  </div>
</div>

<section style="margin-top: 4.8rem">
  <h3 class="an-text--h2">Próximas Citas</h3>
  <div class="an-table">
    <div class="an-table__header">
      <div class="an-table__header-cell" style="flex: 1.5">Cliente</div>
      <div class="an-table__header-cell">Servicio</div>
      <div class="an-table__header-cell">Estado</div>
    </div>
    <div class="an-table__row">
      <div class="an-table__cell" style="flex: 1.5; font-weight: 500">Sebastian Ikeda</div>
      <div class="an-table__cell">Descontracturante</div>
      <div class="an-table__cell">
        <span class="an-pill an-pill--success">Confirmado</span>
      </div>
    </div>
  </div>
</section>
