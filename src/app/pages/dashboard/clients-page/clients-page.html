<div class="an-container an-py-6">
  <div class="an-flex an-justify-between an-align-center an-mb-6 title-section">
    <div>
      <h2 class="an-text--h2 an-m-0">Administración de Clientes</h2>
      <p class="an-text--light">Gestiona a tus clientes</p>
    </div>
    <button class="an-button an-button--success" (click)="openNewClient()">
      <an-icon name="user-add-line"></an-icon>
      Nuevo Cliente
    </button>
  </div>

  <div class="an-grid an-grid--responsive an-mb-7">
    <an-card-stats title="Total Clientes" [value]="metricsResource.value()?.data?.totalClients || 0" icon="an-icon-user"
      trendLabel="Registrados activos" [loading]="metricsResource.isLoading()"></an-card-stats>
    <an-card-stats title="Con RUT Registrado" [value]="metricsResource.value()?.data?.clientsWithRutCount || 0"
      icon="an-icon-check" [trend]="(metricsResource.value()?.data?.clientsWithRutPercentage || 0) + '%'"
      trendLabel="del total de clientes" [loading]="metricsResource.isLoading()"></an-card-stats>
    <an-card-stats title="Clientes del Mes" [value]="'+' + (metricsResource.value()?.data?.newClientsThisMonth || 0)"
      icon="an-icon-calendar"
      [trend]="((metricsResource.value()?.data?.newClientsTrendPercentage ?? 0) >= 0 ? '+' : '') + (metricsResource.value()?.data?.newClientsTrendPercentage ?? 0) + '%'"
      [trendDirection]="metricsResource.value()?.data?.newClientsTrendDirection || 'neutral'"
      trendLabel="vs mes anterior" [loading]="metricsResource.isLoading()"></an-card-stats>
    <an-card-stats title="Tasa de Retención" [value]="(metricsResource.value()?.data?.retentionRate || 0) + '%'"
      icon="an-icon-user" trendLabel="clientes con 2+ citas" [loading]="metricsResource.isLoading()"></an-card-stats>
    <!-- <an-card-stats
      title="LTV Promedio"
      [value]="((metricsResource.value()?.data?.averageLtv || 0) | currency: 'CLP' : '$' : 'symbol' : '1.0-0') || ''"
      icon="an-icon-money"
      trendLabel="ingreso histórico por cliente"
      [loading]="metricsResource.isLoading()"
    ></an-card-stats> -->
  </div>

  <section class="">
    <div class="an-flex an-justify-end an-pt-4">
      <div class="an-field an-field--has-icon-start an-w-50">
        <div class="an-field__input-wrapper">
          <span class="an-field__icon an-field__icon--start">
            <an-icon name="search-line"></an-icon>
          </span>
          <input type="text" class="an-field__input" placeholder="Escribe el nombre del cliente..."
            (input)="onSearch($event)" />
        </div>
      </div>
    </div>
    <app-table [columns]="columns()" [data]="clientsResource.value()?.data || []"
      [loading]="clientsResource.isLoading()">
      <ng-template anTemplate="rut" let-row>
        <code class="an-text--light">{{ row.rut || 'No registrado' }}</code>
      </ng-template>

      <ng-template anTemplate="phone" let-row>
        <div class="an-flex an-flex-column">
          <span class="an-text--bold">{{ row.phone }}</span>
        </div>
      </ng-template>
      <ng-template anTemplate="email" let-row>
        <div class="an-flex an-flex-column">
          <small class="an-text--light">{{ row.email }}</small>
        </div>
      </ng-template>

      <ng-template anTemplate="actions" let-row>
        <div class="table-btns">
          <button class="an-button an-button--outline-warning an-button--sm" (click)="handleEdit(row)" title="Editar">
            <an-icon name="pencil-line"></an-icon>
            Editar
          </button>
          <button class="an-button an-button--outline-info an-button--sm" title="Ver más" (click)="handleView(row)">
            Ver más
            <an-icon name="booklet-line"></an-icon>
          </button>
          <button class="an-button an-button--outline-danger an-button--sm" title="Eliminar"
            (click)="handleDelete(row)">
            <an-icon name="delete-bin-6-line"></an-icon>
          </button>
        </div>
      </ng-template>
    </app-table>
    <app-pagination [totalItems]="clientsResource.value()?.meta?.total || 0" [pageSize]="searchQuery().pagination.limit"
      [currentPage]="searchQuery().pagination.page" (pageChange)="changePage($event)">
    </app-pagination>
  </section>
</div>
