<div class="an-container an-py-6">
  <div class="an-flex an-justify-between an-align-center an-mb-6 title-section">
    <div>
      <h2 class="an-text--h2 an-m-0">Administración de Clientes</h2>
      <p class="an-text--light">Gestiona a tus clientes</p>
    </div>
    <button class="an-button an-button--success" (click)="openNewClient()">
      <an-icon name="user-add-line"></an-icon>
      Nuevo Cliente
    </button>
  </div>

  <div class="an-grid an-grid--responsive an-mb-7">
    <an-card-stats
      title="Total Clientes"
      [value]="clientsResource.value()?.data?.length || 0"
      icon="an-icon-user"
      trend="+12"
      trendDirection="up"
    ></an-card-stats>
    <an-card-stats
      title="Con RUT Registrado"
      value="850"
      icon="an-icon-check"
      trend="68%"
    ></an-card-stats>
    <an-card-stats
      title="Clientes del Mes"
      value="+45"
      icon="an-icon-calendar"
      trend="+15%"
      trendDirection="up"
    ></an-card-stats>
  </div>
  <section class="an-card">
    <app-table
      [columns]="columns()"
      [data]="clientsResource.value()?.data || []"
      [loading]="clientsResource.isLoading()"
    >
      <ng-template anTemplate="rut" let-row>
        <code class="an-text--light">{{ row.rut || 'No registrado' }}</code>
      </ng-template>

      <ng-template anTemplate="phone" let-row>
        <div class="an-flex an-flex-column">
          <span class="an-text--bold">{{ row.phone }}</span>
        </div>
      </ng-template>
      <ng-template anTemplate="email" let-row>
        <div class="an-flex an-flex-column">
          <small class="an-text--light">{{ row.email }}</small>
        </div>
      </ng-template>

      <ng-template anTemplate="actions" let-row>
        <div class="table-btns">
          <button
            class="an-button an-button--warning an-button--sm"
            (click)="handleEdit(row)"
            title="Editar"
          >
            <an-icon name="pencil-line"></an-icon>
          </button>
          <button
            class="an-button an-button--danger an-button--sm"
            title="Eliminar"
            (click)="handleDelete(row)"
          >
            <an-icon name="delete-bin-7-line"></an-icon>
          </button>
        </div>
      </ng-template>
    </app-table>
    <app-pagination
      [totalItems]="clientsResource.value()?.meta?.total || 0"
      [pageSize]="limit()"
      [currentPage]="currentPage()"
      (pageChange)="changePage($event)"
    >
    </app-pagination>
  </section>

  <app-drawer [title]="drawerTitle()" [isOpen]="isDrawerOpen()" (close)="isDrawerOpen.set(false)">
    <form [formGroup]="clientForm" class="an-flex an-flex-column an-gap-6">
      <div class="an-field" [class.an-field--danger]="formUtils.isInvalidInput('fullName')">
        <label class="an-field__label">Nombre Completo</label>
        <input
          type="text"
          class="an-field__input"
          formControlName="fullName"
          placeholder="Ej: Ana María"
        />
      </div>

      <div class="an-flex an-gap-4 an-w-full">
        <div class="an-field an-w-50" [class.an-field--danger]="formUtils.isInvalidInput('rut')">
          <label class="an-field__label">RUT</label>
          <input
            type="text"
            class="an-field__input"
            formControlName="rut"
            placeholder="12.345.678-9"
          />
        </div>
        <div class="an-field an-w-50">
          <label class="an-field__label">Teléfono</label>
          <input
            type="text"
            class="an-field__input"
            formControlName="phone"
            placeholder="+569..."
          />
        </div>
      </div>

      <div class="an-field">
        <label class="an-field__label">Correo Electrónico</label>
        <input
          type="email"
          class="an-field__input"
          formControlName="email"
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div class="an-field">
        <label class="an-field__label">Dirección</label>
        <input type="text" class="an-field__input" formControlName="address" />
      </div>

      <div class="an-field">
        <label class="an-field__label">Notas / Alergias</label>
        <textarea class="an-field__input" formControlName="notes" rows="3"></textarea>
      </div>
    </form>

    <div footer class="an-flex an-w-full an-gap-3">
      <button class="an-button an-button--outline an-flex-fill" (click)="isDrawerOpen.set(false)">
        Cancelar
      </button>
      <button
        class="an-button an-button--primary an-flex-fill"
        (click)="saveClient()"
        [disabled]="!formUtils.canSave()"
      >
        {{ clientService.selectedClient() ? 'Actualizar' : 'Guardar Cliente' }}
      </button>
    </div>
  </app-drawer>
</div>
