<div class="an-container">
  <h2 class="an-title">Gestión de Clientes</h2>

  <app-table [columns]="columns()" [data]="appointments()">
    <ng-template anTemplate="status" let-row>
      <span
        class="an-pill"
        [class.an-pill--success]="row.isActive"
        [class.an-pill--danger]="!row.isActive"
      >
        {{ row.isActive ? 'Confirmada' : 'Cancelada' }}
      </span>
    </ng-template>

    <ng-template anTemplate="actions" let-row>
      <div style="display: flex; gap: 0.8rem">
        <button class="an-button an-button--sm" (click)="handleEdit(row)">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
        <button class="an-button an-button--danger an-button--sm" title="Eliminar">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
          </svg>
        </button>
      </div>
    </ng-template>
  </app-table>

  <app-pagination
    [totalItems]="totalClients()"
    [pageSize]="20"
    [currentPage]="page()"
    (pageChange)="onPageChange($event)"
  >
  </app-pagination>
</div>
