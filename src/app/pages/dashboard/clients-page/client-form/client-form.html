<form [formGroup]="clientForm" class="an-flex an-flex-column an-gap-6">
  <div class="an-field" [class.an-field--danger]="formUtils.isInvalidInput('name')">
    <label class="an-field__label">Nombre Completo</label>
    <input type="text" class="an-field__input" formControlName="name" placeholder="Ej: Ana María" />
  </div>

  <div class="an-flex an-gap-4 an-w-full">
    <div class="an-field an-w-50" [class.an-field--danger]="formUtils.isInvalidInput('rut')">
      <label class="an-field__label">RUT</label>
      <input type="text" class="an-field__input" formControlName="rut" placeholder="12.345.678-9" />
    </div>
    <div class="an-field an-w-50">
      <label class="an-field__label">Teléfono</label>
      <input type="text" class="an-field__input" formControlName="phone" placeholder="+569..." />
    </div>
  </div>

  <div class="an-field">
    <label class="an-field__label">Correo Electrónico</label>
    <input
      type="email"
      class="an-field__input"
      formControlName="email"
      placeholder="correo@ejemplo.com"
    />
  </div>

  <div class="an-field">
    <label class="an-field__label">Dirección</label>
    <input type="text" class="an-field__input" formControlName="address" />
  </div>

  <div class="an-field">
    <label class="an-field__label">Notas / Alergias</label>
    <app-note-editor formControlName="notes" />
  </div>
</form>

<div footer class="an-flex an-w-full an-gap-3 an-mt-7">
  <button class="an-button an-button--outline an-flex-fill" (click)="drawer.close()">
    Cancelar
  </button>
  <button
    class="an-button an-button--primary an-flex-fill"
    (click)="saveClient()"
    [disabled]="!formUtils.canSave() || isSaving()"
  >
    {{ clientService.selectedClient() ? 'Actualizar' : 'Guardar Cliente' }}
  </button>
</div>
