<aside class="db-sidebar">
  <div class="db-logo">
    <img src="assets/images/logo.png" alt="Anami Logo" class="logo-img" />
  </div>

  <nav>
    @for (item of navItems; track item.route) {
      <a
        class="an-cell"
        [routerLink]="item.route"
        routerLinkActive="an-cell--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        @switch (item.icon) {
          @case ('grid') {
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          }
          @case ('calendar') {
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          }
          @case ('users') {
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          }
          @case ('star') {
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              ></path>
            </svg>
          }
          @case ('bar-chart') {
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          }
        }
        <span class="an-cell__title">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="db-profile">
    <div class="profile-container">
      <div class="an-cell" style="padding-left: 0; border: none; background: transparent;">
        <div class="user-avatar"></div>
        <span class="an-cell__title" [title]="currentUser()?.fullName || 'Usuario'">
          {{ currentUser()?.fullName || 'Usuario' }}
        </span>
      </div>
      <button class="logout-btn" (click)="logout()" title="Cerrar Sesión">
        <an-icon name="logout-box-r-line" [size]="18"></an-icon>
      </button>
    </div>
  </div>
</aside>
